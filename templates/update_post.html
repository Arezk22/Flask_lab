{% extends 'base.html' %}

{% block title %} update_post #{{ post.id }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4 p-md-5">
      <h2 class="h3 fw-bold mb-4 text-warning border-bottom pb-2">✏️ Update Post</h2>

      <form action="{{ url_for('posts_class.post_edit', post_id=post.id) }}" method="POST">
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Post Title</label>
          <input type="text" class="form-control form-control-lg" id="title" name="title" value="{{ post.title }}"
            required>
        </div>

        <div class="mb-4">
          <label for="content" class="form-label fw-semibold">Post Content </label>
          <textarea class="form-control" id="content" name="content" rows="6" required>{{ post.content }}</textarea>

        </div>
        <div class="mb-4">
          <label for="author" class="form-label fw-semibold">Author</label>
          <input type="text" class="form-control" id="author" name="author" value="{{ post.author }}" required>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('posts_class.list_create_view') }}" class="btn btn-light px-4">Cancel</a>
          <button type="submit" class="btn btn-primary px-5">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
